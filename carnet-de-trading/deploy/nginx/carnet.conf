# Reverse proxy TLS pour Carnet de Trading (nginx ≥ 1.18).
# Emplacement : /etc/nginx/sites-available/carnet.conf
# Activer : ln -s /etc/nginx/sites-available/carnet.conf /etc/nginx/sites-enabled/
# Certificat : certbot --nginx -d carnet.exemple.fr  (ou certificat interne)
#
# Le service écoute uniquement sur 127.0.0.1:8080 : n'ouvrez jamais ce port
# directement sur Internet.

limit_req_zone $binary_remote_addr zone=carnet_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name carnet.exemple.fr;

    # Renouvellement ACME puis redirection intégrale vers HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name carnet.exemple.fr;

    ssl_certificate     /etc/letsencrypt/live/carnet.exemple.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carnet.exemple.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # En-têtes de sécurité (l'application applique déjà sa CSP sur ses
    # réponses ; ces valeurs couvrent les fichiers statiques et les erreurs).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
    proxy_connect_timeout 10s;

    # Le jeton de session circule dans l'en-tête Authorization : jamais dans
    # les journaux d'accès du proxy.
    access_log /var/log/nginx/carnet.access.log combined;
    error_log  /var/log/nginx/carnet.error.log warn;

    location = /api/auth/login {
        limit_req zone=carnet_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_hide_header X-Powered-By;
    }
}
